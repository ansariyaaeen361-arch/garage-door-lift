# Nginx reverse proxy for Garage Door Lift.
# Copy to /etc/nginx/conf.d/garage-door-lift.conf on the VPS.
# This VPS already hosts 2 other MERN apps behind Nginx — this is a SEPARATE server
# block (own conf.d file, own domain/subdomain, own upstream port), so it will not
# touch their config. Just make sure the port below matches deploy/ecosystem.config.js.
# certbot will rewrite this automatically to add the SSL block — run it AFTER this file is in place.

server {
    listen 80;
    listen [::]:80;
    server_name garagedoorslift.com www.garagedoorslift.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
